<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>
        <div class="auth-header">
          <mat-icon class="auth-icon">login</mat-icon>
          <h2>Sign In</h2>
        </div>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <mat-form-field appearance="outline" class="form-field-full-width">
          <mat-label>Email</mat-label>
          <input 
            matInput 
            formControlName="email" 
            type="email" 
            placeholder="Enter your email"
            autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            {{ getEmailErrorMessage() }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field-full-width">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            formControlName="password" 
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Enter your password"
            autocomplete="current-password">
          <button 
            mat-icon-button 
            matSuffix 
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword"
            type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{ getPasswordErrorMessage() }}
          </mat-error>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit"
          class="auth-button"
          [disabled]="loginForm.invalid || isLoading">
          <mat-spinner 
            *ngIf="isLoading" 
            diameter="20" 
            color="accent" 
            style="margin-right: 8px;">
          </mat-spinner>
          {{ isLoading ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions class="auth-actions">
      <p class="auth-link-text">
        Don't have an account? 
        <a routerLink="/auth/register" class="auth-link">Sign up here</a>
      </p>
    </mat-card-actions>
  </mat-card>

  <!-- Demo credentials info -->
  <mat-card class="demo-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>info</mat-icon>
        Demo Credentials
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="demo-credentials">
        <div class="demo-user">
          <strong>Admin:</strong> admin&#64;example.com / Admin&#64;1234$
        </div>
        <div class="demo-user">
          <strong>Editor:</strong> editor&#64;example.com / Editor&#64;1234$
        </div>
        <div class="demo-user">
          <strong>Viewer:</strong> viewer&#64;example.com / Viewer&#64;1234$
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
