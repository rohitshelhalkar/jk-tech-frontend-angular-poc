<div class="app-container" [class.is-mobile]="isHandset$ | async">
  
  <!-- Header Toolbar -->
  <mat-toolbar color="primary" class="app-header">
    <button 
      *ngIf="showSidenav && (isLoggedIn$ | async)"
      type="button" 
      aria-label="Toggle sidenav" 
      mat-icon-button 
      (click)="drawer.toggle()">
      <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
    </button>
    
    <span class="app-title">{{ title }}</span>
    
    <div class="spacer"></div>
    
    <!-- User Menu -->
    <div *ngIf="isLoggedIn$ | async; else loginButton" class="user-menu">
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      
      <mat-menu #userMenu="matMenu">
        <div class="user-info" *ngIf="currentUser$ | async as user">
          <div class="user-name">{{ user.name }}</div>
          <div class="user-email">{{ user.email }}</div>
          <div class="user-role">
            <span [class]="getUserRoleClass(user.role)">{{ user.role }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
    
    <ng-template #loginButton>
      <button mat-button routerLink="/auth/login">
        <mat-icon>login</mat-icon>
        Login
      </button>
    </ng-template>
  </mat-toolbar>

  <!-- Sidenav Container -->
  <mat-sidenav-container class="sidenav-container" *ngIf="showSidenav && (isLoggedIn$ | async)">
    <mat-sidenav #drawer class="sidenav" fixedInViewport
        [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
        [mode]="(isHandset$ | async) ? 'over' : 'side'"
        [opened]="(isHandset$ | async) === false">
      
      <mat-toolbar>Navigation</mat-toolbar>
      
      <mat-nav-list>
        <ng-container *ngIf="currentUser$ | async as user">
          <a *ngFor="let item of menuItems" 
             mat-list-item 
             [routerLink]="item.path" 
             routerLinkActive="active-link"
             [style.display]="canShowMenuItem(item, user) ? 'block' : 'none'"
             (click)="closeDrawerOnMobile()">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <div matListItemTitle>{{ item.label }}</div>
          </a>
        </ng-container>
      </mat-nav-list>
    </mat-sidenav>
    
    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <!-- Content without sidenav for auth pages -->
  <div *ngIf="!showSidenav || !(isLoggedIn$ | async)" class="auth-content">
    <router-outlet></router-outlet>
  </div>

</div>
